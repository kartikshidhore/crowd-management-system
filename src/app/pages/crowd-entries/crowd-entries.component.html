<mat-sidenav-container class="sidenav-container">
  
  <mat-sidenav mode="side" [opened]="true" [disableClose]="true" #sidenav [class.collapsed]="!sidebarOpen" class="app-sidenav">
    <div class="sidebar-header">
      <div class="logo-area" *ngIf="sidebarOpen">
         <img src="Kloudspot_Horizontal.svg" alt="Kloudspot" class="brand-logo">
      </div>
      <button mat-icon-button class="toggle-btn" (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
    
    <mat-nav-list>
      <a mat-list-item class="nav-item" routerLink="/dashboard">
        <img src="home_logo.svg" alt="Overview" class="nav-icon" matListItemIcon>
        <span matListItemTitle *ngIf="sidebarOpen">Overview</span>
      </a>
      <a mat-list-item class="nav-item active" routerLink="/crowd-entries">
        <img src="crowd_logo.svg" alt="Crowd Entries" class="nav-icon" matListItemIcon>
        <span matListItemTitle *ngIf="sidebarOpen">Crowd Entries</span>
      </a>
    </mat-nav-list>

    <div class="logout-area">
      <button mat-button class="logout-btn" (click)="logout()">
        <mat-icon>power_settings_new</mat-icon> 
        <span *ngIf="sidebarOpen">Logout</span>
      </button>
    </div>
  </mat-sidenav>
  <mat-sidenav-content class="main-content" [class.loading]="isLoading">
    
    <app-navbar></app-navbar>
    
    <div class="loader-overlay" *ngIf="isLoading">
      <mat-spinner diameter="60"></mat-spinner>
    </div>
    
    <div class="entries-body">
      <div class="page-header">
        <h1>Overview</h1>
        <div class="date-picker-wrapper">
          <button mat-stroked-button class="date-picker-button" (click)="picker.open()">
            <mat-icon>calendar_today</mat-icon>
            <span>{{ dateDisplayText }}</span>
          </button>
          <mat-form-field class="hidden-date-input">
            <input matInput 
                   [matDatepicker]="picker" 
                   [(ngModel)]="selectedDate"
                   [max]="maxDate"
                   (dateChange)="onDateChange($event.value)">
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
        </div>
      </div>

      <mat-card class="entries-table-card">
        <table mat-table [dataSource]="displayedRecords" class="entries-table">
 
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let record" class="name-cell">
              <div class="name-container">
                <div class="avatar" *ngIf="record.avatar">
                  <img [src]="record.avatar" [alt]="record.name">
                </div>
                <div class="avatar-placeholder" *ngIf="!record.avatar">
                  {{ record.name.charAt(0).toUpperCase() }}
                </div>
                <span>{{ record.name }}</span>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="sex">
            <th mat-header-cell *matHeaderCellDef>Sex</th>
            <td mat-cell *matCellDef="let record">{{ formatSex(record.sex) }}</td>
          </ng-container>

          <ng-container matColumnDef="entry">
            <th mat-header-cell *matHeaderCellDef>Entry</th>
            <td mat-cell *matCellDef="let record">{{ record.entry }}</td>
          </ng-container>

          <ng-container matColumnDef="exit">
            <th mat-header-cell *matHeaderCellDef>Exit</th>
            <td mat-cell *matCellDef="let record">{{ record.exit }}</td>
          </ng-container>

          <ng-container matColumnDef="dwellTime">
            <th mat-header-cell *matHeaderCellDef>Dwell Time</th>
            <td mat-cell *matCellDef="let record">{{ record.dwellTime }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card>

      <div class="custom-paginator">
        <button mat-icon-button (click)="goToPage(pageIndex - 1)" [disabled]="pageIndex === 0">
          <mat-icon>chevron_left</mat-icon>
        </button>
        
        <button 
          *ngFor="let page of getPageNumbers()" 
          mat-button 
          [class.active]="page === pageIndex + 1"
          [class.ellipsis]="page === '...'"
          [disabled]="page === '...'"
          (click)="handlePageClick(page)">
          {{ page }}
        </button>
        
        <button mat-icon-button (click)="goToPage(pageIndex + 1)" [disabled]="pageIndex >= totalPages - 1">
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>

<app-alerts-sidebar></app-alerts-sidebar>
